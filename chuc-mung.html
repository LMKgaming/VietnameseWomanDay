<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Ngày Phụ Nữ Việt Nam 20/10 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 50%, #e0e7ff 100%);
            color: #3b2a4a;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 16px;
        }

        #fireworks-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9990;
        }

        .container {
            max-width: 560px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardEntrance 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .top-badge {
            display: inline-block;
            background: white;
            color: #9333ea;
            padding: 7px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.1);
            margin-bottom: 16px;
            border: 2px solid #e9d5ff;
        }

        h1 {
            font-family: 'Coiny', cursive;
            font-size: 2.1rem;
            color: #7e22ce;
            margin-bottom: 22px;
            font-weight: 400;
        }

        .wish-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 32px;
            padding: 40px 28px;
            border: 4px solid white;
            box-shadow: 0 12px 0px #e9d5ff, 0 20px 45px rgba(126, 34, 206, 0.14);
            position: relative;
        }

        .card-icon {
            width: 92px;
            height: 92px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border: 3px dashed #d8b4fe;
            animation: float 2.5s ease-in-out infinite;
        }

        .wish-heading {
            font-family: 'Dancing Script', cursive;
            font-size: 2.35rem;
            color: #be185d;
            margin-bottom: 16px;
        }

        .wish-text {
            font-size: 1.08rem;
            line-height: 1.8;
            color: #4a355a;
            margin-bottom: 22px;
        }

        .wish-note {
            background: #fdf4ff;
            border: 1.5px dashed #e879f9;
            border-radius: 18px;
            padding: 14px 18px;
            font-size: 0.96rem;
            color: #86198f;
            font-weight: 600;
            line-height: 1.6;
        }

        .footer-note {
            margin-top: 22px;
            font-size: 0.92rem;
            color: #6b5380;
            font-weight: 600;
        }

        .falling-sparkle {
            position: fixed;
            top: -10vh;
            font-size: 1.3rem;
            pointer-events: none;
            z-index: 5;
            animation: fall linear forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(25px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>

    <script>
        // KHO 10 LỜI CHÚC TỰ NHIÊN, Ý NGHĨA DÀNH CHO CÁC BẠN NỮ (Mỗi lần F5 tự động đổi 1 lời chúc mới)
        const WISH_POOL = [
            {
                icon: "🌸",
                heading: "Luôn Xinh Đẹp & Rạng Rỡ Nhất!",
                text: "Chúc bạn một ngày Phụ nữ Việt Nam 20/10 ngập tràn hoa, quà và những niềm vui ngọt ngào. Mong bạn luôn giữ được nụ cười tươi tắn, sự tự tin và tỏa sáng theo cách riêng của mình!",
                note: "🌷 Chúc bạn không chỉ hôm nay mà cả 365 ngày trong năm đều tràn ngập hạnh phúc!"
            },
            {
                icon: "🍀",
                heading: "Mọi Dự Định Đều Thành Hiện Thực!",
                text: "Nhân ngày 20/10, chúc bạn luôn gặp thật nhiều thuận lợi và may mắn trên hành trình mình đã chọn. Mong mọi kế hoạch, công việc hay mục tiêu sắp tới của bạn đều gặt hái được kết quả rực rỡ!",
                note: "✨ Hãy luôn vững tin và tiến về phía trước với thật nhiều năng lượng tích cực nhé!"
            },
            {
                icon: "💖",
                heading: "Ngập Tràn Yêu Thương & Niềm Vui!",
                text: "Gửi đến bạn những lời chúc tốt đẹp nhất nhân ngày 20/10! Mong bạn luôn được bao bọc bởi sự chân thành, ấm áp từ những người xung quanh và mỗi ngày trôi qua đều là một ngày đáng nhớ.",
                note: "💝 Chúc bạn có một ngày lễ thật trọn vẹn bên gia đình và những người thân yêu!"
            },
            {
                icon: "🌷",
                heading: "Tâm Hồn Luôn Tươi Mát & Bình Yên!",
                text: "Giữa nhịp sống bận rộn mỗi ngày, chúc bạn luôn giữ được sự an nhiên, thư thái và nụ cười trong trẻo. Mong mọi áp lực đều tan biến, nhường chỗ cho những khoảnh khắc nhẹ nhàng và vui vẻ nhất!",
                note: "🌿 Chúc bạn luôn khỏe mạnh, yêu đời và tận hưởng trọn vẹn từng khoảnh khắc!"
            },
            {
                icon: "🌟",
                heading: "Tỏa Sáng Với Nguồn Năng Lượng Tích Cực!",
                text: "Cảm ơn bạn vì đã luôn mang đến sự vui vẻ, chu đáo và ấm áp cho mọi người xung quanh. Chúc bạn ngày 20/10 nhận lại thật nhiều niềm vui và những điều bất ngờ dễ thương nhất!",
                note: "✨ Mong bạn luôn giữ mãi ngọn lửa nhiệt huyết và nụ cười tỏa nắng trên môi!"
            },
            {
                icon: "🦋",
                heading: "Thanh Xuân Rực Rỡ & Đáng Nhớ!",
                text: "Chúc bạn có một mùa 20/10 thật ý nghĩa! Hãy luôn yêu thương bản thân, làm những điều mình thích, đi đến những nơi mình mong muốn và viết nên thật nhiều kỷ niệm đẹp nhé!",
                note: "🌸 Chúc mọi điều tốt lành và ngọt ngào nhất sẽ luôn đồng hành cùng bạn!"
            },
            {
                icon: "💎",
                heading: "Thành Công & Độc Lập, Tự Tin!",
                text: "Nhân ngày Phụ nữ Việt Nam 20/10, chúc bạn luôn vừa dịu dàng duyên dáng, vừa bản lĩnh tự tin. Dù ở bất kỳ lĩnh vực nào, mong bạn cũng luôn đạt được những thành tựu đáng tự hào!",
                note: "👑 Chúc bạn ngày lễ thật nhiều hoa thơm, quà đẹp và tiếng cười!"
            },
            {
                icon: "🌈",
                heading: "Đón Nhận Thật Nhiều Tin Vui Mới!",
                text: "Ngày 20/10 hôm nay là dịp đặc biệt để gửi tới bạn ngàn lời chúc tốt lành. Mong rằng thời gian tới sẽ mở ra cho bạn thật nhiều cơ hội mới, niềm vui mới và những thành công vượt mong đợi!",
                note: "🍀 Chúc bạn luôn gặp may mắn và thuận lợi trong mọi công việc!"
            },
            {
                icon: "🍓",
                heading: "Ngọt Ngào, Trẻ Trung & Yêu Đời!",
                text: "Chúc bạn ngày Phụ nữ Việt Nam 20/10 tràn ngập tiếng cười! Mong bạn lúc nào cũng giữ được nét trẻ trung, lạc quan và luôn là phiên bản hạnh phúc nhất của chính mình!",
                note: "💖 Chúc bạn có những buổi hẹn thật vui và ấm áp trong ngày hôm nay nhé!"
            },
            {
                icon: "💐",
                heading: "Vạn Sự Như Ý, Hạnh Phúc Đong Đầy!",
                text: "Nhân ngày tôn vinh phái đẹp 20/10, xin gửi tới bạn lời chúc sức khỏe, sắc đẹp và thành công. Mong bạn luôn giữ được trái tim ấm áp và đón nhận thật nhiều điều tuyệt vời trong cuộc sống!",
                note: "🌷 Chúc mừng ngày Phụ nữ Việt Nam 20/10 rực rỡ và ý nghĩa!"
            }
        ];

        function loadRandomWishOnEnter() {
            let lastIdx = parseInt(sessionStorage.getItem('friends_last_wish') || '-1', 10);
            let nextIdx;
            do {
                nextIdx = Math.floor(Math.random() * WISH_POOL.length);
            } while (nextIdx === lastIdx && WISH_POOL.length > 1);
            sessionStorage.setItem('friends_last_wish', nextIdx);

            const item = WISH_POOL[nextIdx];
            document.getElementById('w-icon').innerText = item.icon;
            document.getElementById('w-heading').innerText = item.heading;
            document.getElementById('w-text').innerText = item.text;
            document.getElementById('w-note').innerText = item.note;
        }

        // HỆ THỐNG PHÁO HOA MỖI 5 GIÂY
        let fwCtx, fwCanvas, particles = [];
        function initFireworks() {
            fwCanvas = document.getElementById('fireworks-canvas');
            fwCtx = fwCanvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            requestAnimationFrame(animateFireworks);
            launchFireworkBurst();
            setInterval(launchFireworkBurst, 5000);
        }

        function resizeCanvas() {
            if (!fwCanvas) return;
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
        }

        function launchFireworkBurst() {
            const colors = ['#ec4899', '#8b5cf6', '#f472b6', '#a855f7', '#fbbf24', '#38bdf8'];
            for (let b = 0; b < 2; b++) {
                setTimeout(() => {
                    const x = window.innerWidth * (0.2 + Math.random() * 0.6);
                    const y = window.innerHeight * (0.15 + Math.random() * 0.45);
                    for (let i = 0; i < 45; i++) {
                        const angle = (Math.PI * 2 * i) / 45;
                        const speed = 2 + Math.random() * 4.5;
                        particles.push({
                            x, y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            alpha: 1,
                            color: colors[Math.floor(Math.random() * colors.length)],
                            size: 2.5 + Math.random() * 2.5
                        });
                    }
                }, b * 350);
            }
        }

        function animateFireworks() {
            fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.06;
                p.alpha -= 0.016;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                fwCtx.globalAlpha = p.alpha;
                fwCtx.fillStyle = p.color;
                fwCtx.beginPath();
                fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fwCtx.fill();
            }
            requestAnimationFrame(animateFireworks);
        }

        function startSparkles() {
            const icons = ['🌸', '✨', '💖', '🌷', '🎀', '🍀'];
            setInterval(() => {
                const el = document.createElement('div');
                el.classList.add('falling-sparkle');
                el.innerText = icons[Math.floor(Math.random() * icons.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 3 + 3.5) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 6500);
            }, 420);
        }

        window.addEventListener("DOMContentLoaded", function () {
            loadRandomWishOnEnter();
            initFireworks();
            startSparkles();
        });
    </script>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div class="container">
        <div class="top-badge">🌸 Ngày Phụ Nữ Việt Nam 20/10 🌸</div>
        <h1>Gửi Ngàn Lời Chúc Tốt Đẹp Đến Bạn</h1>

        <div class="wish-card">
            <div class="card-icon" id="w-icon">🌸</div>
            <h2 class="wish-heading" id="w-heading"></h2>
            <p class="wish-text" id="w-text"></p>
            <div class="wish-note" id="w-note"></div>
        </div>

        <p class="footer-note">💝 Chúc bạn một ngày 20/10 thật rạng rỡ, ấm áp và tràn ngập niềm vui!</p>
    </div>

</body>
</html>
